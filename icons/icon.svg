<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5E2FD"/>
      <stop offset="50%" stop-color="#67C2F0"/>
      <stop offset="100%" stop-color="#1B82D2"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="100%" stop-color="#FFCE54"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#skyGrad)"/>
  
  <!-- Subtle inner shadow / border -->
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>

  <!-- Sun Rays (Ohisama motif) -->
  <g transform="translate(380, 130)">
    <circle r="44" fill="url(#sunGrad)" filter="url(#glow)"/>
    <!-- Corona rays -->
    <path d="M0 -60 L0 -72 M0 60 L0 72 M-60 0 L-72 0 M60 0 L72 0 M-42 -42 L-52 -52 M42 42 L52 52 M-42 42 L-52 52 M42 -42 L52 -52" stroke="#FFF0A0" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Scanner Frame -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none">
    <!-- Top-left -->
    <path d="M120 180 L120 140 A20 20 0 0 1 140 120 L180 120" />
    <!-- Top-right -->
    <path d="M332 120 L372 120 A20 20 0 0 1 392 140 L392 180" />
    <!-- Bottom-left -->
    <path d="M120 332 L120 372 A20 20 0 0 0 140 392 L180 392" />
    <!-- Bottom-right -->
    <path d="M332 392 L372 392 A20 20 0 0 0 392 372 L392 332" />
  </g>

  <!-- Scan laser beam -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="#FFFFFF" stroke-width="5" opacity="0.9" filter="url(#glow)"/>
  <line x1="140" y1="256" x2="372" y2="256" stroke="#FFFAEB" stroke-width="7" opacity="0.7"/>

  <!-- Serial Ticket Card Shape inside -->
  <rect x="156" y="200" width="200" height="112" rx="14" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.6)" stroke-width="3" backdrop-filter="blur(5px)"/>
  
  <!-- Serial text mockup lines -->
  <text x="256" y="246" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="4">HINATA46</text>
  <text x="256" y="280" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#EAF7FF" letter-spacing="3">XXXX-XXXX</text>
</svg>
